[workspace]

[package]
name = "spade-referent-rs"
version = "0.1.0"
edition = "2021"

[features]
alpha-persistence = ["dep:alphalpha", "dep:itertools", "dep:lophat"]

[dependencies]
alphalpha = { version = "0.1.0", optional = true }
itertools = { version = "0.10.5", optional = true }
lophat = { version = "0.9.2", default-features = false, optional = true }
spade = "2.15"

[profile.release]
opt-level = 3
lto = "thin"
